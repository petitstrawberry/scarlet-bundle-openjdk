name: Producer checks
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s producer/tests -p 'test_*.py'
      - run: python3 producer/build.py --help
      - run: sh -n bundles/openjdk-21/build.sh bundles/openjdk-25/build.sh
